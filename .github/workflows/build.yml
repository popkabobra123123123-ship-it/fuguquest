name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        working-directory: rust
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: fuguquest-linux
          path: rust/target/release/fuguquest
          if-no-files-found: error

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # arm64 fuguquest as a static musl binary — native build inside an arm64 Alpine
      # container (qemu-emulated on the x86_64 runner; the crate is zero-dep, so this
      # needs no NDK and no cross toolchain).
      - name: arm64 fuguquest (static musl)
        run: |
          docker run --platform linux/arm64 --rm -v "$PWD:/src" -w /src/rust alpine:latest \
            sh -c "apk add -q cargo gcc musl-dev && cargo build --release --target aarch64-unknown-linux-musl"

      - name: Build fugu-root.apk
        run: bash app/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: fugu-root-apk
          path: app/build/fugu-root.apk
          if-no-files-found: error
